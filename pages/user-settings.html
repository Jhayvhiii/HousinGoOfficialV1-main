<!-- User Settings Page -->
<main class="container" id="user-settings-page" style="display: none;">
 <div style="max-width: 800px; margin: 60px auto; background-color: #FFFFFF; padding: 50px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h1 style="font-size: 36px; margin-bottom: 30px; color: #8B4513; text-align: center;">Account Settings</h1><!-- Personal Information Section -->
  <div style="margin-bottom: 40px;">
   <h2 style="font-size: 24px; margin-bottom: 20px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 10px;">Personal Information</h2>
   <form id="update-profile-form" onsubmit="handleUpdateProfile(event)">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
     <div><label for="settings-firstname" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">First Name</label> <input type="text" id="settings-firstname" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
     </div>
     <div><label for="settings-lastname" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Last Name</label> <input type="text" id="settings-lastname" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
     </div>
    </div>
    <div style="margin-bottom: 20px;"><label for="settings-email" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Email Address</label> <input type="email" id="settings-email" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div>
    <div style="margin-bottom: 20px;"><label for="settings-mobile" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Mobile Number</label> <input type="tel" id="settings-mobile" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div>
    <div style="margin-bottom: 20px;"><label for="settings-role" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Account Type</label> <input type="text" id="settings-role" readonly style="width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-size: 16px; color: #8B4513; background-color: #F5F5F5;">
    </div><button type="submit" class="btn" style="width: 100%; padding: 15px; font-size: 18px; margin-bottom: 20px;">Update Profile</button>
   </form>
  </div><!-- Change Password Section -->
  <div style="margin-bottom: 40px;">
   <h2 style="font-size: 24px; margin-bottom: 20px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 10px;">Change Password</h2>
   <form id="change-password-form" onsubmit="handleChangePassword(event)">
    <div style="margin-bottom: 20px;"><label for="current-password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Current Password</label> <input type="password" id="current-password" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div>
    <div style="margin-bottom: 20px;"><label for="new-password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">New Password</label> <input type="password" id="new-password" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div>
    <div style="margin-bottom: 20px;"><label for="confirm-new-password" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Confirm New Password</label> <input type="password" id="confirm-new-password" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div><button type="submit" class="btn" style="width: 100%; padding: 15px; font-size: 18px;">Change Password</button>
   </form>
  </div>
 </div>
</main>
