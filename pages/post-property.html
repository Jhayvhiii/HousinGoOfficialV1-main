<!-- Post / Edit Property Page -->
<main class="container" id="post-property-page" style="display: none;">
 <div style="max-width: 820px; margin: 60px auto; background-color: #FFFFFF; padding: 48px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h1 id="post-property-heading" style="font-size: 36px; margin-bottom: 20px; color: #8B4513; text-align: center;">Post New Property</h1>

  <div id="post-property-verification-banner" class="verification-banner" role="status">
   <div style="font-size: 24px;">⏳</div>
   <div>
    <strong>Pending Verification:</strong> Only verified landlords can publish new property listings. Please wait for an administrator to verify your account.
   </div>
  </div>

  <div id="post-property-alert" class="auth-alert" role="alert"></div>

  <form id="post-property-form" onsubmit="handlePostProperty(event)">
   <input type="hidden" id="edit-property-id" value="">

   <div style="margin-bottom: 24px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Property Photos</h3>
    <input type="file" id="property-images" multiple accept="image/*" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px;">
    <p style="font-size: 13px; color: #654321; margin-top: 6px;">Images upload directly to Supabase Storage (<code>property-images</code> bucket).</p>
    <div id="image-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px;"></div>
   </div>

   <div style="margin-bottom: 20px;">
    <label for="property-name" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Property Title</label>
    <input type="text" id="property-name" required placeholder="e.g., Cozy Studio near BGC, Sunshine Boarding House" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>

   <div style="margin-bottom: 20px;">
    <label for="property-address" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Location / Address</label>
    <input type="text" id="property-address" required placeholder="e.g., Brgy. East Rembo, Taguig City" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>

   <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
    <div>
     <label for="monthly-rent" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Monthly Price (₱)</label>
     <input type="number" id="monthly-rent" min="0" step="0.01" required placeholder="8500" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
    </div>
    <div>
     <label for="property-availability-status" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Availability Status</label>
     <select id="property-availability-status" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
      <option value="available">Available</option>
      <option value="occupied">Occupied</option>
      <option value="hidden">Hidden</option>
     </select>
    </div>
   </div>

   <div style="margin-bottom: 24px;">
    <label for="property-description" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Description (Amenities, Rules, Landmarks)</label>
    <textarea id="property-description" rows="5" required placeholder="Describe room size, inclusions (Wi-Fi, aircon, water), nearby landmarks, and house rules..." style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513; resize: vertical; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></textarea>
   </div>

   <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 26px;">
    <div>
     <label for="contact-name" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Landlord Name</label>
     <input type="text" id="contact-name" readonly style="width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-size: 16px; color: #8B4513; background-color: #F5F5F5;">
    </div>
    <div>
     <label for="contact-number" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Contact Phone</label>
     <input type="tel" id="contact-number" readonly style="width: 100%; padding: 12px; border: 2px solid #E0E0E0; border-radius: 8px; font-size: 16px; color: #8B4513; background-color: #F5F5F5;">
    </div>
   </div>

   <div style="display: flex; gap: 15px;">
    <button type="submit" id="post-property-submit-btn" class="btn" style="flex: 1; padding: 15px; font-size: 18px;">Publish Property</button>
    <button type="button" class="btn-secondary" onclick="showPage('landlord-dashboard')" style="flex: 1; padding: 15px; font-size: 18px;">Cancel</button>
   </div>
  </form>
 </div>
</main>
