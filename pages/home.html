<!-- Home Page -->
<section class="hero" id="home-page">
 <div class="container">
  <h1 id="site-name-hero">HousinGo</h1>
  <p id="tagline">Your next home is just a click away.</p>
  <div class="search-bar"><input type="text" id="search-input" placeholder="Property name, city, barangay, or address">
   <div class="search-divider"></div><select id="type-search"> <option value="">Property Type</option> <option value="Bed Spacer">Bed Spacer</option> <option value="Single Room">Single Room</option> <option value="Boarding House">Boarding House</option> <option value="Studio Type">Studio Type</option> <option value="Single Family">Single Family</option> </select>
   <div class="search-divider"></div><select id="price-search"> <option value="">Price Range</option> <option value="5000">Up to ₱5,000</option> <option value="10000">Up to ₱10,000</option> <option value="15000">Up to ₱15,000</option> <option value="20000">Up to ₱20,000</option> <option value="999999">₱20,000+</option> </select> <button class="btn" id="search-btn">🔍 Search</button>
  </div>
 </div>
</section>
<main id="home-content">
 <div class="home-toolbar">
  <div class="filters" style="margin: 0;">
   <div class="filter-buttons"><button class="filter-btn active" data-type="">🏘️ All</button> <button class="filter-btn" data-type="Bed Spacer">🛏️ Bed Spacer</button> <button class="filter-btn" data-type="Single Room">🚪 Single Room</button> <button class="filter-btn" data-type="Boarding House">🏢 Boarding House</button> <button class="filter-btn" data-type="Single Family">🏠 Single Family</button> <button class="filter-btn" data-type="Studio Type">🏠 Studio Type</button>
   </div>
  </div>
  <button type="button" id="toggle-map-btn" class="btn-secondary" onclick="toggleHomeMap()" style="padding: 9px 16px; font-size: 14px;">🗺️ Hide Map</button>
 </div>

 <!-- Spotahome-Style Split Screen: Left = Listings, Right = Sticky GPS Map -->
 <div id="home-split-layout" class="home-split-layout">
  <div class="home-listings-column">
   <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Loading properties...</p>
   </div>
   <div id="properties-container" class="properties-grid home-grid" style="display: none;"></div>
   <div id="empty-state" class="empty-state" style="display: none;">
    <div class="empty-state-icon">🏠</div>
    <h3>No properties found</h3>
    <p>Try adjusting your search or filters</p>
   </div>
  </div>

  <aside class="home-map-column" aria-label="Interactive GPS Map">
   <div class="map-panel-header">
    <div class="map-panel-title">🗺️ <span id="map-results-count">0 rentals on map</span></div>
    <div class="map-panel-actions">
     <button type="button" class="gps-pill-btn" onclick="locateUserOnMap()" title="Find rentals near your GPS location">📍 Near Me (GPS)</button>
     <button type="button" class="gps-pill-btn" onclick="resetMapToEastRembo()" title="Center map on Brgy. East Rembo">🎯 East Rembo</button>
    </div>
   </div>
   <div id="home-gps-map"></div>
  </aside>
 </div>
</main>
