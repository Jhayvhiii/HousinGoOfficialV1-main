<!-- Admin Dashboard -->
<main id="admin-dashboard-page" style="display: none;">
 <div style="max-width: 80%; margin: 40px auto; background-color: #FFFFFF; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 25px;">
   <h1 style="font-size: 36px; color: #8B4513; margin: 0;">Admin Dashboard</h1>
   <button class="btn" onclick="loadAdminDashboard()" style="padding: 10px 20px;">🔄 Refresh All</button>
  </div>

  <!-- Stats from admin_reports view -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px;">
   <div style="background-color: #ADD8E6; padding: 24px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 8px;">Total Users</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="admin-total-users">0</p>
   </div>
   <div style="background-color: #E8F5E9; padding: 24px; border-radius: 10px;">
    <h3 style="color: #2E7D32; margin-bottom: 8px;">Total Listings</h3>
    <p style="font-size: 32px; font-weight: bold; color: #2E7D32;" id="admin-total-properties">0</p>
   </div>
   <div style="background-color: #FFF0F0; padding: 24px; border-radius: 10px;">
    <h3 style="color: #B42318; margin-bottom: 8px;">Open Complaints</h3>
    <p style="font-size: 32px; font-weight: bold; color: #B42318;" id="admin-open-complaints">0</p>
   </div>
  </div>

  <!-- User Management -->
  <div style="margin-bottom: 42px;">
   <h2 style="font-size: 24px; margin-bottom: 14px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 8px;">👥 User Management</h2>
   <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
    <input type="text" id="admin-user-search" placeholder="Search name or email..." style="flex: 1; min-width: 200px; padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
    <select id="admin-user-role-filter" style="padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
     <option value="">All Roles</option>
     <option value="tenant">Tenant</option>
     <option value="landlord">Landlord</option>
     <option value="admin">Admin</option>
    </select>
    <select id="admin-user-status-filter" style="padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
     <option value="">All Statuses</option>
     <option value="active">Active</option>
     <option value="suspended">Suspended</option>
     <option value="pending">Pending</option>
    </select>
    <button class="btn" onclick="loadAdminUsers()" style="padding: 10px 18px;">Filter</button>
   </div>
   <div id="admin-users-list"></div>
  </div>

  <!-- Property Moderation -->
  <div style="margin-bottom: 42px;">
   <h2 style="font-size: 24px; margin-bottom: 14px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 8px;">🏠 Property Moderation</h2>
   <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
    <input type="text" id="admin-prop-search" placeholder="Search title or location..." style="flex: 1; min-width: 200px; padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
    <select id="admin-prop-status-filter" style="padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
     <option value="">All Availability</option>
     <option value="available">Available</option>
     <option value="occupied">Occupied</option>
     <option value="hidden">Hidden</option>
     <option value="removed">Removed</option>
    </select>
    <button class="btn" onclick="loadAdminProperties()" style="padding: 10px 18px;">Filter</button>
   </div>
   <div id="admin-properties-list"></div>
  </div>

  <!-- Complaints Management -->
  <div style="margin-bottom: 42px;">
   <h2 style="font-size: 24px; margin-bottom: 14px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 8px;">🚨 Complaints Management</h2>
   <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
    <select id="admin-complaint-status-filter" onchange="loadAdminComplaints()" style="padding: 10px 14px; border: 2px solid #ADD8E6; border-radius: 8px;">
     <option value="">All Statuses</option>
     <option value="open">Open</option>
     <option value="under_review">Under Review</option>
     <option value="resolved">Resolved</option>
     <option value="dismissed">Dismissed</option>
    </select>
   </div>
   <div id="admin-complaints-list"></div>
  </div>

  <!-- System Audit Log -->
  <div>
   <h2 style="font-size: 24px; margin-bottom: 14px; color: #8B4513; border-bottom: 2px solid #ADD8E6; padding-bottom: 8px;">📜 System Audit Records</h2>
   <div id="admin-system-records"></div>
  </div>
 </div>
</main>
