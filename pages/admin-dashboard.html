<!-- Admin Dashboard -->
<main id="admin-dashboard-page" style="display: none;">
 <div class="dash-shell dash-fullscreen">
  <div class="dash-hero-bar">
   <div>
    <span class="dash-role-pill">🛡️ Admin Control Center</span>
    <h1 style="font-size: 32px; color: #FFFFFF; margin: 10px 0 4px; letter-spacing: -0.02em;">Admin Dashboard</h1>
    <p style="color: rgba(255,255,255,0.88); font-size: 14px; margin: 0;">Verify landlords, moderate listings, resolve complaints, and review system audit logs.</p>
   </div>
   <button class="btn dash-hero-cta" onclick="loadAdminDashboard()">🔄 Refresh All</button>
  </div>

  <!-- Stats from admin_reports view -->
  <div class="kpi-grid">
   <div class="kpi-card">
    <div>
     <div class="kpi-label">Total Users</div>
     <p class="kpi-value" id="admin-total-users">0</p>
    </div>
    <div class="kpi-icon">👥</div>
   </div>
   <div class="kpi-card green">
    <div>
     <div class="kpi-label">Total Listings</div>
     <p class="kpi-value" style="color: #2E7D32;" id="admin-total-properties">0</p>
    </div>
    <div class="kpi-icon">🏠</div>
   </div>
   <div class="kpi-card red">
    <div>
     <div class="kpi-label">Open Complaints</div>
     <p class="kpi-value" style="color: #DC2626;" id="admin-open-complaints">0</p>
    </div>
    <div class="kpi-icon">🚨</div>
   </div>
  </div>

  <!-- Tabbed Navigation -->
  <div class="dash-tabs" data-tab-group="admin">
   <button type="button" class="dash-tab-btn active" data-tab-target="admin-tab-users" onclick="switchDashboardTab('admin', 'admin-tab-users')">👥 Users</button>
   <button type="button" class="dash-tab-btn" data-tab-target="admin-tab-properties" onclick="switchDashboardTab('admin', 'admin-tab-properties')">🏠 Properties</button>
   <button type="button" class="dash-tab-btn" data-tab-target="admin-tab-complaints" onclick="switchDashboardTab('admin', 'admin-tab-complaints')">🚨 Complaints</button>
   <button type="button" class="dash-tab-btn" data-tab-target="admin-tab-audit" onclick="switchDashboardTab('admin', 'admin-tab-audit')">📜 Audit Log</button>
  </div>

  <div id="admin-tab-users" class="dash-tab-panel active" data-tab-group="admin">
   <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;">
    <input type="text" id="admin-user-search" placeholder="Search name or email..." style="flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
    <select id="admin-user-role-filter" style="padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
     <option value="">All Roles</option>
     <option value="tenant">Tenant</option>
     <option value="landlord">Landlord</option>
     <option value="admin">Admin</option>
    </select>
    <select id="admin-user-status-filter" style="padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
     <option value="">All Statuses</option>
     <option value="active">Active</option>
     <option value="suspended">Suspended</option>
     <option value="pending">Pending</option>
    </select>
    <button class="btn" onclick="loadAdminUsers()" style="padding: 10px 18px;">Filter</button>
   </div>
   <div id="admin-users-list"></div>
  </div>

  <div id="admin-tab-properties" class="dash-tab-panel" data-tab-group="admin">
   <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;">
    <input type="text" id="admin-prop-search" placeholder="Search title or location..." style="flex: 1; min-width: 200px; padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
    <select id="admin-prop-status-filter" style="padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
     <option value="">All Availability</option>
     <option value="available">Available</option>
     <option value="occupied">Occupied</option>
     <option value="hidden">Hidden</option>
     <option value="removed">Removed</option>
    </select>
    <button class="btn" onclick="loadAdminProperties()" style="padding: 10px 18px;">Filter</button>
   </div>
   <div id="admin-properties-list"></div>
  </div>

  <div id="admin-tab-complaints" class="dash-tab-panel" data-tab-group="admin">
   <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;">
    <select id="admin-complaint-status-filter" onchange="loadAdminComplaints()" style="padding: 10px 14px; border: 1.5px solid #D8D2C7; border-radius: 10px;">
     <option value="">All Statuses</option>
     <option value="open">Open</option>
     <option value="under_review">Under Review</option>
     <option value="resolved">Resolved</option>
     <option value="dismissed">Dismissed</option>
    </select>
   </div>
   <div id="admin-complaints-list"></div>
  </div>

  <div id="admin-tab-audit" class="dash-tab-panel" data-tab-group="admin">
   <div id="admin-system-records"></div>
  </div>
 </div>
</main>
