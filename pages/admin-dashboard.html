<!-- Admin Dashboard -->
<main id="admin-dashboard-page" style="display: none;">
 <div style="max-width: 70%; margin: 40px auto; background-color: #FFFFFF; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h1 style="font-size: 36px; margin-bottom: 30px; color: #8B4513;">Admin Dashboard</h1>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Total Properties</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="admin-total-properties">0</p>
   </div>
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Registered Users</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="admin-total-users">0</p>
   </div>
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Pending Approvals</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="admin-pending-properties">0</p>
   </div>
  </div>
  <div style="margin-bottom: 30px;">
   <h2 style="font-size: 24px; margin-bottom: 20px; color: #8B4513;">User Management</h2>
   <div id="admin-users-list"></div>
  </div>
  <div>
   <h2 style="font-size: 24px; margin-bottom: 20px; color: #8B4513;">Property Management</h2>
   <div id="admin-properties-list"></div>
  </div>
 </div>
</main>
