<!-- Landlord Dashboard -->
<main id="landlord-dashboard-page" style="display: none;">
 <div style="max-width: 70%; margin: 40px auto; background-color: #FFFFFF; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h1 style="font-size: 36px; margin-bottom: 20px; color: #8B4513;">Landlord Dashboard</h1>
  <div id="landlord-verification-banner" class="verification-banner" role="status">
   <div style="font-size: 24px;">⏳</div>
   <div>
    <strong>Pending Verification:</strong> Your landlord account is currently awaiting admin verification. You can explore your dashboard, but posting new properties is disabled until an admin verifies your account.
   </div>
  </div>
  <div style="margin-bottom: 30px;"><button id="landlord-add-property-btn" class="btn" onclick="showPage('post-property')" style="font-size: 18px; padding: 15px 30px;">+ Add New Property</button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">My Properties</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="landlord-total-properties">0</p>
   </div>
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Available</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="landlord-available-properties">0</p>
   </div>
   <div style="background-color: #ADD8E6; padding: 25px; border-radius: 10px;">
    <h3 style="color: #8B4513; margin-bottom: 10px;">Occupied</h3>
    <p style="font-size: 32px; font-weight: bold; color: #8B4513;" id="landlord-occupied-properties">0</p>
   </div>
  </div>
  <div>
   <h2 style="font-size: 24px; margin-bottom: 20px; color: #8B4513;">My Listings</h2>
   <div id="landlord-properties-list"></div>
  </div>
 </div>
</main>
