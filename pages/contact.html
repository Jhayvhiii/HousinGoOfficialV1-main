<!-- Contact Us Page -->
<main class="container" id="contact-page" style="display: none;">
 <div style="max-width: 700px; margin: 60px auto; background-color: #FFFFFF; padding: 50px 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h1 style="font-size: 36px; margin-bottom: 15px; color: #8B4513; text-align: center;">Contact Us</h1>
  <p style="text-align: center; margin-bottom: 40px; color: #654321; font-size: 16px;">Have questions or concerns? We'd love to hear from you!</p>
  <form id="contact-form" onsubmit="handleContact(event)">
   <div style="margin-bottom: 20px;"><label for="contact-name" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Name</label> <input type="text" id="contact-name" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>
   <div style="margin-bottom: 20px;"><label for="contact-mobile" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Mobile Number</label> <input type="tel" id="contact-mobile" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>
   <div style="margin-bottom: 20px;"><label for="contact-email" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Email Address</label> <input type="email" id="contact-email" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>
   <div style="margin-bottom: 20px;"><label for="contact-subject" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Subject</label> <input type="text" id="contact-subject" required style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513;">
   </div>
   <div style="margin-bottom: 25px;"><label for="contact-message" style="display: block; margin-bottom: 8px; font-weight: 600; color: #8B4513;">Message</label> <textarea id="contact-message" required rows="6" style="width: 100%; padding: 12px; border: 2px solid #ADD8E6; border-radius: 8px; font-size: 16px; color: #8B4513; resize: vertical; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"></textarea>
   </div><button type="submit" class="btn" style="width: 100%; padding: 15px; font-size: 18px;">Send Message</button>
  </form>
 </div>
</main>
